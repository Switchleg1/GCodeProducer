[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gcodeproducer"
version = "0.1.213"
description = "Slicer / CAM app that produces G-code through a stage pipeline (Qt6 GUI + CLI)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.5", "PyOpenGL>=3.1", "numpy>=1.24", "shapely>=2.0"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gcodeproducer = "gcodeproducer.cli:main"

[project.gui-scripts]
gcodeproducer-gui = "gcodeproducer.gui.app:run_gui"

[tool.setuptools.packages.find]
include = ["gcodeproducer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
